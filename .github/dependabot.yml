version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
